[package]
name = "time-tracking-api"
version = "0.1.0"
edition = "2021"
default-run = "time-tracking-api"

[lib]
name = "time_tracking_api"
path = "src/lib.rs"

[[bin]]
name = "time-tracking-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
genpdf = "0.2"
async-trait = "0.1"
axum-extra = { version = "0.9", features = ["cookie"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
time = "0.3"

name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api }}
      desktop: ${{ steps.filter.outputs.desktop }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # fetch-depth: 0 gives paths-filter the merge-base it needs to do a
      # local git diff for pull_request events — avoids hitting the GitHub
      # API (which intermittently returns "Bad credentials" when the
      # default token is restricted by branch-protection rules).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          # Compare against the PR base for pull_request events; for
          # workflow_dispatch / push the action falls back to its default.
          base: ${{ github.event.pull_request.base.sha || '' }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filters: |
            app:
              - 'app/**'
              - 'extensions/**'
              - 'package.json'
              - 'package-lock.json'
              - 'website/netlify.toml'
              - 'demo/**'
            api:
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            desktop:
              - 'desktop/**'
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            e2e:
              - 'app/**'
              - 'extensions/**'
              - 'api/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'

  app:
    name: App (XMLUI build sanity)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_UI: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Workspaces root install — covers app, website, demo, and animo-blocks.
      # We delete package-lock.json + node_modules before `npm install` to
      # work around npm/cli#4828: when the lockfile was generated on a
      # different platform (macOS dev machine), `npm ci` on Linux skips
      # platform-specific optional bindings (e.g. @rolldown/binding-linux-x64-gnu),
      # and the build then crashes inside rolldown with "Cannot find native
      # binding". `--ignore-scripts` skips the broken xmlui-pdf@0.1.13
      # postinstall (runtime is unaffected).
      - name: Install workspace dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts

      # Cache turbo's build artifacts across runs — animo-blocks/dist and
      # app/dist get reused when their inputs haven't changed.
      - uses: rharkor/caching-for-turbo@v2.3.1

      # Turbo's `^build:extension` dependsOn in turbo.json automatically
      # builds animo-blocks before animo-app's build:demo, so we don't
      # need a separate pre-build step.
      - name: Build demo (production)
        run: npx turbo run build:demo --filter=animo-app
        env:
          VITE_ANIMO_DEMO: 'true'

  api:
    name: API (Rust)
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          key: api-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  desktop:
    name: Desktop (Tauri build check)
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: desktop-test

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  e2e-smoke:
    name: E2E smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
    env:
      TURBO_UI: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # Workspaces root install — covers app, website, demo, and animo-blocks.
      # See npm/cli#4828: a macOS-generated lockfile leaves out Linux
      # optional bindings (e.g. @rolldown/binding-linux-x64-gnu) under
      # `npm ci`, so we wipe and reinstall to get the right per-platform
      # binaries. `--ignore-scripts` skips the broken xmlui-pdf@0.1.13
      # postinstall (runtime is unaffected).
      - name: Install workspace dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Cache turbo artifacts — shares with the `app` job's cache key.
      - uses: rharkor/caching-for-turbo@v2.3.1

      - name: Build app (demo mode)
        run: npx turbo run build:demo --filter=animo-app
        env:
          VITE_ANIMO_DEMO: 'true'

      - name: Run smoke tests
        working-directory: e2e
        run: npm test -- --grep @smoke || true
        # `|| true` while the @smoke tag and test selection are still being
        # established. Drop this once a stable smoke subset exists.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 7

name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      desktop: ${{ steps.filter.outputs.desktop }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'extensions/**'
              - 'package.json'
              - 'package-lock.json'
              - 'netlify.toml'
            api:
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            desktop:
              - 'desktop/**'
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            e2e:
              - 'web/**'
              - 'extensions/**'
              - 'api/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'

  web:
    name: Web (XMLUI build sanity)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_UI: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Workspaces root install — covers web, website, and animo-blocks
      # in one npm ci. --ignore-scripts works around the broken
      # xmlui-pdf@0.1.13 postinstall.
      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      # Cache turbo's build artifacts across runs — animo-blocks/dist and
      # web/dist get reused when their inputs haven't changed.
      - uses: rharkor/caching-for-turbo@v2.3.1

      # Turbo's `^build:extension` dependsOn in turbo.json automatically
      # builds animo-blocks before animo-web's build:demo, so we don't
      # need a separate pre-build step.
      - name: Build demo (production)
        run: npx turbo run build:demo --filter=animo-web
        env:
          VITE_ANIMO_DEMO: 'true'

  api:
    name: API (Rust)
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          key: api-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  desktop:
    name: Desktop (Tauri build check)
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: desktop-test

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  e2e-smoke:
    name: E2E smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
    env:
      TURBO_UI: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # Workspaces root install — covers web, website, and animo-blocks
      # in one npm ci. --ignore-scripts skips the broken xmlui-pdf@0.1.13
      # postinstall (runtime is unaffected).
      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Cache turbo artifacts — shares with the `web` job's cache key.
      - uses: rharkor/caching-for-turbo@v2.3.1

      - name: Build web (demo mode)
        run: npx turbo run build:demo --filter=animo-web
        env:
          VITE_ANIMO_DEMO: 'true'

      - name: Run smoke tests
        working-directory: e2e
        run: npm test -- --grep @smoke || true
        # `|| true` while the @smoke tag and test selection are still being
        # established. Drop this once a stable smoke subset exists.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 7

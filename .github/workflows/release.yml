name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vN.N.N) — must already exist on origin'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag }}

jobs:

  verify:
    name: Verify tag + changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse + validate tag
        id: parse
        run: |
          tag="${TAG}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match vN.N.N (got: $tag)"
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag does not exist on origin"
            exit 1
          fi

          if ! grep -qE "^##\s*\[?${version}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}"
            exit 1
          fi

  create-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog body for ${{ needs.verify.outputs.version }}
        id: changelog
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## *\\[?" ver "\\]?" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md

          if ! [ -s release-body.md ]; then
            echo "::warning::changelog body for $version is empty"
            echo "_(see CHANGELOG.md)_" > release-body.md
          fi

          {
            echo
            echo "---"
            echo
            echo "**Install:** see [docs/install.md](docs/install.md) or run the one-liner from the README."
          } >> release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Animo ${{ env.TAG }}
          body_path: release-body.md
          draft: true
          prerelease: false

  build-desktop:
    name: Desktop / ${{ matrix.label }}
    needs: [verify, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TURBO_UI: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - label: macos-intel
            os: macos-14
            target: x86_64-apple-darwin
          - label: windows-amd64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      # Skip the entire build if this platform's expected artifacts are
      # already attached to the release (idempotent re-dispatch after a
      # partial failure: only missing platforms actually rebuild).
      - name: Check existing release artifacts
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          case "${{ matrix.label }}" in
            linux-amd64)   expected="Animo_${version}_amd64.AppImage Animo_${version}_amd64.deb" ;;
            macos-arm64)   expected="Animo_${version}_aarch64.dmg" ;;
            macos-intel)   expected="Animo_${version}_x64.dmg" ;;
            windows-amd64) expected="Animo_${version}_x64.msi" ;;
          esac
          existing=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          skip=true
          for f in $expected; do
            if ! printf '%s\n' "$existing" | grep -qx "$f"; then
              echo "missing: $f"; skip=false
            fi
          done
          if [ "$skip" = true ]; then
            echo "All expected ${{ matrix.label }} desktop artifacts already present — skipping build."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip != 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          workspaces: desktop
          key: release-desktop-${{ matrix.label }}

      - name: Install Linux dependencies
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      # Workspaces root install — covers app, website, demo, and the
      # animo-blocks extension package. We wipe node_modules + the lockfile
      # before `npm install` to work around npm/cli#4828: a macOS-generated
      # lockfile leaves out Linux optional bindings (e.g.
      # @rolldown/binding-linux-x64-gnu) under `npm ci`, and the build
      # then crashes inside rolldown. `--ignore-scripts` skips the broken
      # xmlui-pdf@0.1.13 postinstall (runtime is unaffected).
      - name: Install workspace dependencies
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts

      # Cache turbo's build artifacts across release runs.
      - uses: rharkor/caching-for-turbo@v2.3.1
        if: steps.gate.outputs.skip != 'true'

      # Pre-build animo-blocks and the app bundle before Tauri builds the
      # desktop shell. Tauri's `beforeBuildCommand` (`npm --prefix app run
      # build-prod`) reads app/index.ts which imports `animo-blocks` —
      # without dist/animo-blocks.mjs, the bundle fails to resolve.
      # Turbo's `^build:extension` dependsOn builds animo-blocks first.
      - name: Pre-build animo-blocks + app
        if: steps.gate.outputs.skip != 'true'
        run: npx turbo run build-prod --filter=animo-app
        env:
          VITE_ANIMO_VERSION: ${{ needs.verify.outputs.version }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Install tauri CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g @tauri-apps/cli@^2

      # Tauri picks up the signing credentials from these env vars at
      # build time and emits a `.sig` (base64 ed25519 signature) next to
      # each updater bundle (`*.app.tar.gz` on macOS, `*.AppImage.tar.gz`
      # on Linux, `*.msi.zip` / `*.nsis.zip` on Windows). When the secret
      # is unset (initial-key-rotation window, fork build) we leave updater
      # artifacts disabled so the release still produces installers. The
      # publish-manifest job below skips any platform missing a `.sig`, so
      # the installer-only flow is non-fatal.
      - name: Build desktop bundle
        if: steps.gate.outputs.skip != 'true'
        working-directory: desktop
        shell: bash
        run: |
          args=(build --target "${{ matrix.target }}")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ -z "${TAURI_UPDATER_PUBKEY:-}" ]; then
              echo "::error::TAURI_UPDATER_PUBKEY is required when TAURI_SIGNING_PRIVATE_KEY is set"
              exit 1
            fi
            config_json=$(node -e '
              process.stdout.write(JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: {
                  updater: {
                    pubkey: process.env.TAURI_UPDATER_PUBKEY,
                    endpoints: ["https://getanimo.app/updates/latest.json"]
                  }
                }
              }))
            ')
            args+=(--config "$config_json")
          fi
          tauri "${args[@]}"
        env:
          VITE_ANIMO_VERSION: ${{ needs.verify.outputs.version }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Stage artifacts (Linux)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p staging
          version="${{ needs.verify.outputs.version }}"
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            "staging/Animo_${version}_amd64.AppImage" 2>/dev/null || \
            cp target/release/bundle/appimage/*.AppImage \
              "staging/Animo_${version}_amd64.AppImage"
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb \
            "staging/Animo_${version}_amd64.deb" 2>/dev/null || \
            cp target/release/bundle/deb/*.deb \
              "staging/Animo_${version}_amd64.deb"
          # Updater bundle + signature (only when signing is enabled).
          # Tauri 2 writes the updater archive next to the AppImage.
          sig=$(ls target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig 2>/dev/null \
                | head -n1 || true)
          tgz=$(ls target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz 2>/dev/null \
                | head -n1 || true)
          if [ -n "$tgz" ] && [ -n "$sig" ]; then
            cp "$tgz" "staging/Animo_${version}_amd64.AppImage.tar.gz"
            cp "$sig" "staging/Animo_${version}_amd64.AppImage.tar.gz.sig"
          fi
          ls -la staging

      - name: Stage artifacts (macOS)
        if: steps.gate.outputs.skip != 'true' && startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p staging
          version="${{ needs.verify.outputs.version }}"
          case "${{ matrix.label }}" in
            macos-arm64) arch=aarch64 ;;
            macos-intel) arch=x64 ;;
          esac
          src=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -n1)
          cp "$src" "staging/Animo_${version}_${arch}.dmg"
          # Updater bundle + signature (only when signing is enabled).
          # Tauri 2 writes a `.app.tar.gz` next to the macOS app bundle.
          sig=$(ls target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig 2>/dev/null \
                | head -n1 || true)
          tgz=$(ls target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz 2>/dev/null \
                | head -n1 || true)
          if [ -n "$tgz" ] && [ -n "$sig" ]; then
            cp "$tgz" "staging/Animo_${version}_${arch}.app.tar.gz"
            cp "$sig" "staging/Animo_${version}_${arch}.app.tar.gz.sig"
          fi
          ls -la staging

      - name: Stage artifacts (Windows)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          $version = "${{ needs.verify.outputs.version }}"
          $src = Get-ChildItem "target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          Copy-Item $src.FullName "staging/Animo_${version}_x64.msi"
          # Updater bundle + signature (only when signing is enabled).
          # Tauri 2 produces `*.msi.zip` + `*.msi.zip.sig` for the MSI updater.
          $zip = Get-ChildItem "target/${{ matrix.target }}/release/bundle/msi/*.msi.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $sig = Get-ChildItem "target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip -and $sig) {
            Copy-Item $zip.FullName "staging/Animo_${version}_x64.msi.zip"
            Copy-Item $sig.FullName "staging/Animo_${version}_x64.msi.zip.sig"
          }
          Get-ChildItem staging

      - name: Upload artifacts to release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: staging/*

  build-api:
    name: API / ${{ matrix.label }}
    needs: [verify, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: animo-api
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bin: animo-api
          - label: windows-amd64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: animo-api.exe
    steps:
      # Skip the entire build if this platform's expected artifact is
      # already attached to the release (idempotent re-dispatch after a
      # partial failure: only missing platforms actually rebuild).
      - name: Check existing release artifacts
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          case "${{ matrix.label }}" in
            linux-amd64)   expected="animo-api_${version}_linux-amd64.tar.gz" ;;
            macos-arm64)   expected="animo-api_${version}_macos-arm64.tar.gz" ;;
            windows-amd64) expected="animo-api_${version}_windows-amd64.zip" ;;
          esac
          existing=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          skip=true
          for f in $expected; do
            if ! printf '%s\n' "$existing" | grep -qx "$f"; then
              echo "missing: $f"; skip=false
            fi
          done
          if [ "$skip" = true ]; then
            echo "All expected ${{ matrix.label }} api artifacts already present — skipping build."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip != 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          workspaces: api
          key: release-api-${{ matrix.label }}

      - name: Build animo-api (release)
        if: steps.gate.outputs.skip != 'true'
        working-directory: api
        run: cargo build --release --target ${{ matrix.target }} --bin animo-api

      - name: Package (POSIX)
        if: steps.gate.outputs.skip != 'true' && matrix.os != 'windows-2022'
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          name="animo-api_${version}_${{ matrix.label }}"
          mkdir -p staging "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          cp LICENSE "$name/"
          cp api/.env.example "$name/" 2>/dev/null || true
          tar -czf "staging/${name}.tar.gz" "$name"
          ls -la staging

      - name: Package (Windows)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $name = "animo-api_${version}_${{ matrix.label }}"
          New-Item -ItemType Directory -Path staging,$name -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          Copy-Item LICENSE "$name/"
          if (Test-Path "api/.env.example") { Copy-Item "api/.env.example" "$name/" }
          Compress-Archive -Path "$name/*" -DestinationPath "staging/$name.zip"
          Get-ChildItem staging

      - name: Upload artifacts to release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: staging/*

  publish-checksums:
    name: Publish SHA256SUMS + install scripts
    needs: [verify, create-release, build-desktop, build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${TAG}" --dir dist --skip-existing
          ls -la dist

      - name: Copy install scripts into release set
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort \
            | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS + install scripts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/SHA256SUMS.txt
            dist/install.sh
            dist/install.ps1

  publish-manifest:
    name: Publish Tauri update manifest
    needs: [verify, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets cannot gate the whole job (GitHub evaluates `secrets.*` only
    # at step level), so the first step probes for the Netlify credentials
    # and short-circuits the rest of the job when they are absent. Forks
    # and the initial-key-rotation window therefore still produce a clean
    # release — the updater channel just stays on the previous manifest.
    steps:
      - name: Check Netlify deploy credentials
        id: gate
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::NETLIFY_SITE_ID/NETLIFY_AUTH_TOKEN unset; skipping manifest publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install workspace dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Download signed updater assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          # Pull only the updater bundles + signatures. Installer DMGs/MSIs
          # are not used by the updater channel, so we keep the download
          # surface small.
          gh release download "${TAG}" \
            --dir assets \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig' \
            --pattern '*.AppImage.tar.gz' \
            --pattern '*.AppImage.tar.gz.sig' \
            --pattern '*.msi.zip' \
            --pattern '*.msi.zip.sig' \
            --skip-existing
          ls -la assets

      - name: Build manifest from release assets
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: |
          base="https://github.com/${REPO}/releases/download/${TAG}"
          args=("--version" "$VERSION" "--notes" "See CHANGELOG.md" "--out" "website/public/updates/latest.json")

          # Helper: emit a --platform flag when both the archive and its
          # .sig are present in the downloaded set.
          add_platform() {
            local target="$1" archive="$2"
            local sig_path="assets/${archive}.sig"
            local archive_path="assets/${archive}"
            if [ -f "$archive_path" ] && [ -f "$sig_path" ]; then
              local sig
              sig=$(cat "$sig_path")
              args+=("--platform" "${target}=${base}/${archive},${sig}")
            else
              echo "::warning::missing updater assets for ${target} (expected ${archive} + .sig); skipping"
            fi
          }

          add_platform "darwin-aarch64" "Animo_${VERSION}_aarch64.app.tar.gz"
          add_platform "darwin-aarch64-app" "Animo_${VERSION}_aarch64.app.tar.gz"
          add_platform "darwin-x86_64"  "Animo_${VERSION}_x64.app.tar.gz"
          add_platform "darwin-x86_64-app"  "Animo_${VERSION}_x64.app.tar.gz"
          add_platform "linux-x86_64"   "Animo_${VERSION}_amd64.AppImage.tar.gz"
          add_platform "windows-x86_64" "Animo_${VERSION}_x64.msi.zip"

          node scripts/generate-update-manifest.mjs "${args[@]}"
          echo "--- generated manifest ---"
          cat website/public/updates/latest.json

      - name: Validate manifest shape
        if: steps.gate.outputs.skip != 'true'
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("website/public/updates/latest.json", "utf8"));
            if (!m.version || !m.pub_date || typeof m.platforms !== "object") {
              console.error("invalid manifest:", m);
              process.exit(1);
            }
            const count = Object.keys(m.platforms).length;
            if (count === 0) {
              console.error("manifest has no signed platforms; refusing to publish.");
              process.exit(1);
            }
            console.log("manifest ok:", count, "platform(s)");
          '

      - name: Build website deploy directory
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: npx turbo run build:website --filter=animo-website

      - name: Publish website + manifest to Netlify
        if: steps.gate.outputs.skip != 'true'
        working-directory: website
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install --no-audit --no-fund --silent --global netlify-cli@17
          test -f dist-ssg/index.html
          test -f dist-ssg/updates/latest.json
          netlify deploy --prod \
            --filter=animo-website \
            --dir=dist-ssg \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="updater manifest for ${TAG}"

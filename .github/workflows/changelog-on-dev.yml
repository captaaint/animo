name: Update CHANGELOG on dev

# Every push to dev appends the new commits' subjects under ## [Unreleased]
# in CHANGELOG.md. When dev → main is merged via PR, those Unreleased entries
# travel with the merge commit, and `scripts/bump.sh` later promotes them to
# a versioned heading. The actor guard below prevents the workflow from
# looping on its own bot-authored commit.
#
# Note: this workflow no longer triggers a Netlify deploy. Netlify's
# production branch is `main`, and the only production deploy path is
# `release-published.yml` firing the build hook when a GitHub release is
# published — keeps deploy cadence tied to releases, not every dev push.

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: changelog-on-dev
  cancel-in-progress: false

jobs:
  update:
    name: Append new commits to ## [Unreleased]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Skip:
    #   - the bot's own changelog commit (actor check prevents the loop)
    #   - force-pushes (sync-dev.yml resets dev to main; nothing new to record)
    #   - branch deletions
    if: >-
      !github.event.deleted &&
      !github.event.forced &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Append commits to CHANGELOG.md
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: node scripts/changelog-append.mjs

      - name: Commit + push if changed
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No CHANGELOG.md changes; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): auto-update unreleased"
          # Retry the push. GitHub intermittently rejects with a transient
          # "remote: fatal error in commit_refs", and a concurrent push to dev
          # landing between checkout and push makes the update non-fast-forward.
          # Rebasing the single CHANGELOG commit onto the latest origin/dev and
          # retrying absorbs both cases without losing the appended entries.
          for attempt in 1 2 3; do
            if git push origin dev; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; rebasing onto origin/dev and retrying"
            git pull --rebase origin dev || true
            sleep $((attempt * 3))
          done
          echo "::error::failed to push CHANGELOG update after 3 attempts"
          exit 1

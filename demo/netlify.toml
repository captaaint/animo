# Netlify config for the interactive demo deploy (demo.getanimo.app).
#
# The actual app code lives in ../app/ (workspace `animo-app`). This
# folder is a thin wrapper that builds the app in demo mode
# (VITE_ANIMO_DEMO=true, which switches the runtime to the in-browser
# API mock so no backend is required) and republishes the
# artifact here for Netlify to serve.
#
# Set the Netlify site's "Base directory" to `demo` in the dashboard
# (this folder, relative to the repo root). NPM workspaces are detected
# automatically — Netlify runs the install step from the workspace root
# and hoists shared deps into a single node_modules tree.
#
# What this configures:
#   * `publish` — relative to the base directory; the copied vite output.
#   * `command` — the demo workspace's build script orchestrates the
#     animo-app build with VITE_ANIMO_DEMO=true and copies the result
#     into ./dist.

[build]
publish = "dist"
# The cd-up + wipe + npm install is a workaround for npm/cli#4828: a
# macOS-generated lockfile leaves out Linux-specific optional bindings
# (e.g. @rolldown/binding-linux-x64-gnu), and Netlify's default `npm ci`
# skips them — so the subsequent rolldown-driven build crashes with
# "Cannot find native binding". Wiping and reinstalling on Linux fetches
# the correct per-platform binaries.
command = """
cd .. && rm -rf node_modules package-lock.json && \
npm install --no-audit --no-fund --ignore-scripts && \
cd demo && npm run build:demo
"""

[build.environment]
NPM_FLAGS = "--ignore-scripts"
# Node 24 ships npm 11. npm 10 (Node 20) crashes resolving the lockfile-less
# install above ("Cannot read properties of null (reading 'edgesOut')" in
# arborist #loadPeerSet, triggered by vitest's deep optional peer chain).
NODE_VERSION = "24"
# The Turnstile *site* key is public by design (the browser needs it to
# render the widget), so it always ends up in the bundle. Only exempt this
# key; the Turnstile secret key must never reach the client.
SECRETS_SCAN_OMIT_KEYS = "VITE_TURNSTILE_SITE_KEY"

# SPA fallback so deep-linked routes (e.g. /list, /reports) load the
# single index.html and let the client-side router take over.
[[redirects]]
from = "/*"
status = 200
to = "/index.html"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/resources/logo.svg" />
  <!-- Mobile viewport. Deliberate choices:
       - width=device-width, initial-scale=1: standard responsive baseline.
       - maximum-scale=1: blocks iOS Safari's *automatic* zoom when a focused
         input is smaller than 16px, WITHOUT enlarging the text — inputs stay at
         the theme's 13px so mobile matches desktop. iOS 10+ ignores
         maximum-scale for *manual* pinch gestures, so pinch-zoom-to-read stays
         available for accessibility; only the automatic focus-zoom is stopped.
       - interactive-widget=resizes-content: when the on-screen keyboard opens,
         the layout viewport (and our dvh-sized drawers) shrinks, keeping a
         focused field inside a drawer above the keyboard on supporting browsers
         (no-op where unsupported, e.g. current iOS Safari).
       - viewport-fit is intentionally left at the default (NOT cover): edge-to-
         edge would push bottom-drawer content under the iOS home indicator
         unless every surface added safe-area insets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content" />
  <title>Animo - Time tracking for creatives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" />
</head>

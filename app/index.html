<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/resources/logo.svg" />
  <!-- Mobile viewport. Deliberate choices:
       - width=device-width, initial-scale=1: standard responsive baseline.
       - NO user-scalable=no / maximum-scale: pinch-zoom stays available for
         accessibility (the 16px input rule in the <style> below is what stops
         iOS focus auto-zoom, not a locked viewport).
       - interactive-widget=resizes-content: when the on-screen keyboard opens,
         the layout viewport (and our dvh-sized drawers) shrinks, keeping a
         focused field inside a drawer above the keyboard on supporting browsers
         (no-op where unsupported, e.g. current iOS Safari).
       - viewport-fit is intentionally left at the default (NOT cover): edge-to-
         edge would push bottom-drawer content under the iOS home indicator
         unless every surface added safe-area insets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>Animo</title>
  <style>
    /* DatePicker / Select dropdown popovers shouldn't shrink to anchor width */
    [data-radix-popper-content-wrapper] {
      min-width: 280px !important;
    }

    /* iOS Safari auto-zooms the page whenever a focused form control has a
       computed font-size below 16px. Our theme base is 13px (see
       tracker-theme.ts), so every text input/textarea/select triggers that
       zoom on focus. Bump the underlying native controls to 16px on touch
       devices only — desktop keeps the 13px look, and because we don't touch
       the viewport meta tag, pinch-zoom stays available. Checkbox/radio/range
       are excluded (they don't trigger the zoom and font-size can affect their
       sizing). */
    @media (pointer: coarse) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    /* Mobile: hide the brand logo (Animo) in the AppHeader.
       It still appears inside the mobile drawer (NavPanel), which is rendered
       outside [role="banner"], so it remains unaffected. */
    @media (max-width: 991.98px) {
      [role="banner"] [data-part-id="hamburger"] + div {
        display: none;
      }
    }

    /* Force the Page wrapper to flex-grow inside its viewport-sized container
       so the inner Timesheet layout (VStack with height="*", WeekCalendar
       with height: 100%) can size to the available space. The default
       flex: 0 0 auto would collapse the wrapper to content size, leaving
       large empty regions below the calendar on desktop, and letting the
       compact TimerBar drift off-screen on mobile. */
    .xmlui-page-root {
      flex: 1 1 0% !important;
      min-height: 0 !important;
    }

    /* Let XMLUI's Card / Stack content wrappers shrink below their content
       intrinsic size so a child with height: 100% (the WeekCalendar) is
       bounded by the flex chain instead of pushing its parent to overflow.
       Without this, the wrapper keeps its default min-height: auto and the
       calendar grid spills past the viewport. */
    [class*="_wrapper_1j0nj"],
    [class*="_base_z1u49"] {
      min-height: 0 !important;
    }

    /* Reports-only override: drop the Page wrapper's horizontal padding so the
       scrollable VStack reaches the viewport edge and the scrollbar sits flush
       with the right side. The Reports page is identified by its unique
       header-export button — adjust the selector if that test-id changes. */
    .xmlui-page-root:has([data-testid="filter-client"]) {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    /* xmlui's vertical-sticky + scrollWholePage=false layout doesn't provide a
       page-level scroll container (mainContentArea ends up overflow:initial
       per the .vertical:not(.scrollWholePage) rule, and the .desktop rule that
       would set pageContentContainer:auto doesn't apply). Force the page
       content container to be the scroll container so List / Reports / etc.
       can scroll their content while the AppHeader stays sticky. */
    [class*="_pageContentContainer"] {
      overflow-y: auto !important;
    }

    /* Active drag-over feedback for the import drop zone. WebKit (Tauri's
       WKWebView) doesn't expose the dragged file's metadata during dragover,
       so react-dropzone's own accept-gated overlay never fires there — it
       only shows for `isDragActive && isDragAccept`, and isDragAccept stays
       false without readable items. This metadata-free fallback toggles on
       the raw drag events (see the drag-feedback script below) instead. */
    [data-app-dragging="true"] {
      border-color: var(--xmlui-color-primary-500, #3f8f8c) !important;
      background-color: var(--xmlui-color-primary-50, #eef6f5) !important;
    }
  </style>
  <script>window.__PUBLIC_PATH = '/'</script>
  <script>
    window.downloadAuthed = async function (url, _unusedToken, fileName) {
      const resp = await fetch(url, { credentials: 'include' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
    };

    window.fetchPdfBlob = function (url, _unusedToken, onReady, onError, onProgress) {
      var startedAt = Date.now();
      var minVisibleMs = 700;
      var fake = 0.05;
      if (onProgress) onProgress(fake);
      var timer = setInterval(function () {
        fake = Math.min(0.85, fake + 0.08);
        if (onProgress) onProgress(fake);
      }, 100);

      fetch(url, { credentials: 'include' })
        .then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.blob();
        })
        .then(function (blob) {
          clearInterval(timer);
          var blobUrl = URL.createObjectURL(blob);
          var elapsed = Date.now() - startedAt;
          var wait = Math.max(0, minVisibleMs - elapsed);
          setTimeout(function () {
            if (onProgress) onProgress(1);
            setTimeout(function () {
              if (onReady) onReady(blobUrl);
            }, 250);
          }, wait);
        })
        .catch(function (e) {
          clearInterval(timer);
          if (onError) onError(e.message || 'failed');
        });
    };

    window.downloadBlobUrl = function (blobUrl, fileName) {
      var a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    window.revokeBlobUrl = function (blobUrl) {
      try { URL.revokeObjectURL(blobUrl); } catch (e) {}
    };

    window.setIframeBlob = function (selector, blobUrl) {
      var fullUrl = blobUrl + '#toolbar=0&navpanes=0&scrollbar=0&view=FitH';
      var attempts = 0;
      var apply = function () {
        var el = document.querySelector(selector);
        if (el && el.tagName === 'IFRAME') {
          el.removeAttribute('src');
          el.src = fullUrl;
          return;
        }
        if (attempts++ < 30) setTimeout(apply, 50);
      };
      apply();
    };
  </script>
  <script>
    // Drag-over feedback for the import drop zone. In Tauri's WKWebView the
    // dragged file's metadata isn't exposed during dragover, so react-dropzone
    // can't light up its accept-gated overlay (works in Chrome, not in the
    // desktop app). The raw drag *events* still fire there — a plain HTML5
    // drop only happens because dragover was preventDefault'd — so we detect
    // the drag ourselves and toggle a `data-app-dragging` attribute styled in
    // the <style> block above.
    //
    // Capture phase is required: react-dropzone listens in the bubble phase
    // with noDragEventsBubbling (stopPropagation), so a bubble-phase listener
    // here would never see the events. We never preventDefault/stopPropagation,
    // so the component's own drop handling is untouched.
    (function () {
      var SEL = '[data-testid="import-dropzone"]';
      // The element carrying the dashed border is react-dropzone's root — the
      // parent of its hidden file input. Fall back to the test-id host.
      function dashedZone() {
        var host = document.querySelector(SEL);
        if (!host) return null;
        var input = host.querySelector('input[type="file"]');
        return (input && input.parentElement) ? input.parentElement : host;
      }
      var depth = 0;
      function clearAll() {
        depth = 0;
        var els = document.querySelectorAll('[data-app-dragging]');
        for (var i = 0; i < els.length; i++) els[i].removeAttribute('data-app-dragging');
      }
      function zoneFor(e) {
        var t = e.target;
        var host = (t && t.closest) ? t.closest(SEL) : null;
        return host ? dashedZone() : null;
      }
      document.addEventListener('dragenter', function (e) {
        var z = zoneFor(e);
        if (z) { depth++; z.setAttribute('data-app-dragging', 'true'); }
      }, true);
      document.addEventListener('dragleave', function (e) {
        if (zoneFor(e)) { depth = Math.max(0, depth - 1); if (depth === 0) clearAll(); }
      }, true);
      document.addEventListener('drop', clearAll, true);
      document.addEventListener('dragend', clearAll, true);
    })();
  </script>
  <base href="/">
</head>
<body>
<div id="root"></div>
<script type="module" src="/index.ts"></script>
</body>
</html>

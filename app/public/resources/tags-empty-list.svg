<svg width="860" height="432" viewBox="0 0 860 432" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelStroke" x1="278" y1="100" x2="584" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7D0C9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="tagStroke" x1="340" y1="154" x2="525" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7D0C9"/>
      <stop offset="1" stop-color="#3F8F8C"/>
    </linearGradient>
    <linearGradient id="chipLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3F8F8C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 302) rotate(90) scale(110 208)">
      <stop stop-color="#3F8F8C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <ellipse cx="430" cy="308" rx="205" ry="68" fill="url(#glow)"/>

  <!-- particles -->
  <circle cx="248" cy="214" r="4" fill="#3F8F8C" fill-opacity="0.35"/>
  <circle cx="612" cy="218" r="4" fill="#3F8F8C" fill-opacity="0.35"/>
  <circle cx="590" cy="256" r="2.8" fill="#3F8F8C" fill-opacity="0.30"/>
  <circle cx="270" cy="274" r="2.8" fill="#3F8F8C" fill-opacity="0.30"/>

  <!-- main board -->
  <rect x="279" y="113" width="302" height="206" rx="17" stroke="url(#panelStroke)" stroke-width="2" fill="none"/>

  <!-- add badge -->
  <g>
    <circle cx="566" cy="130" r="34" fill="#3F8F8C" fill-opacity="0.18" filter="url(#softGlow)"/>
    <circle cx="566" cy="130" r="22" fill="#3F8F8C" fill-opacity="0.95"/>
    <path d="M566 119V141" stroke="#FAF8F6" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M555 130H577" stroke="#FAF8F6" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- top subtle strip -->
  <rect x="316" y="144" width="116" height="10" rx="5" fill="#3F8F8C" fill-opacity="0.20"/>
  <rect x="441" y="144" width="42" height="10" rx="5" fill="#3F8F8C" fill-opacity="0.32"/>

  <!-- tag chips -->
  <g>
    <!-- chip 1 -->
    <rect x="314" y="176" width="190" height="38" rx="12" fill="#3F8F8C" fill-opacity="0.08"/>
    <path d="M334 195L345.5 183.5C346.455 182.545 347.75 182.008 349.1 182.008H361.6C363.478 182.008 365 183.53 365 185.408V197.9C365 199.25 364.463 200.545 363.508 201.5L352 213L334 195Z" stroke="url(#tagStroke)" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <circle cx="356.5" cy="189.5" r="2.4" fill="#3F8F8C"/>
    <rect x="381" y="189" width="84" height="8" rx="4" fill="url(#chipLine)"/>
    <rect x="473" y="189" width="18" height="8" rx="4" fill="#3F8F8C" fill-opacity="0.45"/>

    <!-- chip 2 -->
    <rect x="314" y="224" width="226" height="38" rx="12" fill="#3F8F8C" fill-opacity="0.06"/>
    <path d="M334 243L345.5 231.5C346.455 230.545 347.75 230.008 349.1 230.008H361.6C363.478 230.008 365 231.53 365 233.408V245.9C365 247.25 364.463 248.545 363.508 249.5L352 261L334 243Z" stroke="#F2A82F" stroke-opacity="0.9" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <circle cx="356.5" cy="237.5" r="2.4" fill="#F2A82F" fill-opacity="0.9"/>
    <rect x="381" y="237" width="112" height="8" rx="4" fill="url(#chipLine)"/>
    <rect x="501" y="237" width="24" height="8" rx="4" fill="#3F8F8C" fill-opacity="0.32"/>

    <!-- chip 3 -->
    <rect x="314" y="272" width="170" height="38" rx="12" fill="#3F8F8C" fill-opacity="0.05"/>
    <path d="M334 291L345.5 279.5C346.455 278.545 347.75 278.008 349.1 278.008H361.6C363.478 278.008 365 279.53 365 281.408V293.9C365 295.25 364.463 296.545 363.508 297.5L352 309L334 291Z" stroke="#A7D0C9" stroke-opacity="0.85" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <circle cx="356.5" cy="285.5" r="2.4" fill="#A7D0C9" fill-opacity="0.85"/>
    <rect x="381" y="285" width="76" height="8" rx="4" fill="url(#chipLine)"/>
  </g>
</svg>

<svg width="860" height="432" viewBox="0 0 860 432" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F8F8C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F8F8C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F8F8C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F8F8C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3F8F8C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ambient floor glow -->
  <ellipse cx="430" cy="360" rx="320" ry="40" fill="url(#floorGlow)"/>

  <!-- ambient particles -->
  <circle cx="70" cy="300" r="3" fill="#3F8F8C" opacity="0.30"/>
  <circle cx="150" cy="380" r="2.5" fill="#3F8F8C" opacity="0.25"/>
  <circle cx="780" cy="320" r="3" fill="#3F8F8C" opacity="0.32"/>
  <circle cx="720" cy="370" r="2.5" fill="#3F8F8C" opacity="0.28"/>

  <!-- main card -->
  <rect x="155" y="60" width="550" height="340" rx="18" fill="none" stroke="url(#panelStroke)" stroke-width="1.5"/>

  <!-- header lines -->
  <rect x="195" y="115" width="280" height="14" rx="4" fill="#3F8F8C" opacity="0.18"/>
  <rect x="485" y="115" width="80" height="14" rx="4" fill="#3F8F8C" opacity="0.12"/>

  <!-- row 1 -->
  <circle cx="220" cy="200" r="18" fill="none" stroke="#cfd8d6" stroke-width="1.8" opacity="0.85"/>
  <circle cx="220" cy="194" r="6" fill="none" stroke="#cfd8d6" stroke-width="1.8" opacity="0.85"/>
  <path d="M208 213 Q220 204 232 213" stroke="#cfd8d6" stroke-width="1.8" fill="none" opacity="0.85"/>
  <rect x="258" y="190" width="220" height="9" rx="3" fill="url(#lineFade)"/>
  <rect x="258" y="205" width="170" height="8" rx="3" fill="#3F8F8C" opacity="0.18"/>
  <rect x="590" y="194" width="70" height="16" rx="8" fill="#3F8F8C" opacity="0.18"/>

  <!-- row 2 -->
  <circle cx="220" cy="270" r="18" fill="none" stroke="#E0A458" stroke-width="1.8"/>
  <circle cx="220" cy="264" r="6" fill="none" stroke="#E0A458" stroke-width="1.8"/>
  <path d="M208 283 Q220 274 232 283" stroke="#E0A458" stroke-width="1.8" fill="none"/>
  <rect x="258" y="260" width="240" height="9" rx="3" fill="url(#lineFade)"/>
  <rect x="258" y="275" width="180" height="8" rx="3" fill="#3F8F8C" opacity="0.18"/>

  <!-- row 3 -->
  <circle cx="220" cy="340" r="18" fill="none" stroke="#3F8F8C" stroke-width="1.8" opacity="0.85"/>
  <circle cx="220" cy="334" r="6" fill="none" stroke="#3F8F8C" stroke-width="1.8" opacity="0.85"/>
  <path d="M208 353 Q220 344 232 353" stroke="#3F8F8C" stroke-width="1.8" fill="none" opacity="0.85"/>
  <rect x="258" y="330" width="210" height="9" rx="3" fill="url(#lineFade)"/>
  <rect x="258" y="345" width="150" height="8" rx="3" fill="#3F8F8C" opacity="0.18"/>

  <!-- add badge with glow -->
  <circle cx="680" cy="90" r="46" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="680" cy="90" r="24" fill="#3F8F8C" opacity="0.95"/>
  <path d="M680 78 V102 M668 90 H692" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
</svg>

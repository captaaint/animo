<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#3F8F8C" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3F8F8C" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#3F8F8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF3F1" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FAF8F6" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="plusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7D0C9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A7D0C9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1E2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="160" cy="170" rx="150" ry="110" fill="url(#glow)"/>

  <!-- card -->
  <rect x="80" y="70" width="160" height="180" rx="14"
        fill="url(#card)" stroke="#A7D0C9" stroke-opacity="0.90" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- folder icon -->
  <g stroke="#3F8F8C" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M115 130 h28 l10 10 h32 a6 6 0 0 1 6 6 v36 a6 6 0 0 1 -6 6 h-70 a6 6 0 0 1 -6 -6 v-46 a6 6 0 0 1 6 -6 z"/>
  </g>

  <!-- text placeholder lines -->
  <rect x="105" y="205" width="110" height="8" rx="4" fill="#3F8F8C" fill-opacity="0.24"/>
  <rect x="105" y="221" width="80"  height="8" rx="4" fill="#3F8F8C" fill-opacity="0.16"/>

  <!-- plus button glow -->
  <circle cx="240" cy="90" r="32" fill="url(#plusGlow)"/>
  <!-- plus button -->
  <circle cx="240" cy="90" r="18" fill="#3F8F8C"/>
  <g stroke="#FAF8F6" stroke-width="2.4" stroke-linecap="round">
    <line x1="240" y1="82" x2="240" y2="98"/>
    <line x1="232" y1="90" x2="248" y2="90"/>
  </g>
</svg>
# Netlify config for the public website deployment.
#
# Deployment mode: standalone XMLUI website + embedded Animo demo build.
#
# What this configures:
#   * `base` — Netlify cd's into website/ before running anything.
#   * `command` — the website build script first builds ../web as a
#     demo-mode Animo app with relative assets and hash routing, then
#     builds this public website and copies the demo output to
#     website/dist/demo-app/.
#   * `/demo` — a website route that embeds `/demo-app/#/` in an iframe,
#     so the interactive product demo is the real Animo app without
#     adding landing-page code to the tracker webapp.
#   * `NPM_FLAGS=--ignore-scripts` — bypasses an upstream `xmlui-pdf`
#     postinstall step that 404s in fresh installs. The package still
#     works in the demo app for our use case.

[build]
base = "website"
publish = "dist-ssg"
command = "npm run build:with-demo"

[build.environment]
NPM_FLAGS = "--ignore-scripts"
NODE_VERSION = "20"

# Disable Netlify's auto-trigger for production deploys. Every dev push used
# to fire two deploys — one for the human commit and one for the bot's
# follow-up `chore(changelog):` commit. The only legitimate production
# deploy path is now the build hook fired by
# .github/workflows/changelog-on-dev.yml AFTER the changelog has been
# updated; build hooks bypass `ignore` per Netlify docs, so they still
# trigger normally. The same hook is reused by release-published.yml.
# Deploy Previews (PRs) are unaffected — they run in the deploy-preview
# context, which has no ignore override.
[context.production.build]
  ignore = "exit 0"

# SPA fallback for website routes. Static files under /demo-app are served
# directly before this fallback, and the embedded demo uses hash routing.
[[redirects]]
from = "/*"
status = 200
to = "/index.html"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/resources/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animo</title>
    <style>
      [data-icon-name],
      :has(> svg[data-icon-name]),
      button [data-part-id="icon"] > span,
      button [data-part-id="icon"] {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      svg[data-icon-name],
      button [data-part-id="icon"] svg {
        display: block;
      }
      /* Site footer: collapse to a centered single column on narrow viewports. */
      @media (max-width: 767px) {
        #site-footer [class*="_horizontal_"] {
          flex-direction: column !important;
          align-items: center !important;
          gap: 0.75rem !important;
        }
        #site-footer [class*="_spacer_"] {
          display: none !important;
        }
        #site-footer [class*="_vertical_"] {
          align-items: center !important;
          text-align: center;
        }
        /* Hide secondary nav links in the header on narrow viewports —
           keeps the row uncluttered when the logo + buttons already fill it. */
        #site-header-nav {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
